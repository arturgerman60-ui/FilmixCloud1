<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Threat Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ0K5QbLw3Ww2jT2Y8RkpCBw5rj2K4s="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Локальный закрытый MVP</p>
        <h1>Карта гражданских рисков</h1>
      </div>
      <div class="status">
        <span id="apiStatus" class="status-dot"></span>
        <span id="apiStatusText">Проверка API...</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="card">
          <h2>Добавить сообщение</h2>
          <p class="muted">
            Вставь текст из источника. Система покажет приблизительную зону/направление с уровнем уверенности.
          </p>
          <form id="reportForm">
            <label>
              Источник
              <input id="sourceInput" name="source" value="manual" maxlength="120" />
            </label>
            <label>
              Текст сообщения
              <textarea
                id="textInput"
                name="text"
                rows="5"
                placeholder="Например: Шахед через Миколаївщину курсом на північний захід"
                required
              ></textarea>
            </label>
            <div class="actions">
              <button type="submit">Добавить на карту</button>
              <button type="button" class="secondary" id="demoButton">Демо</button>
              <button type="button" class="danger" id="clearButton">Очистить</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h2>Фильтры</h2>
          <div class="filters" id="filters"></div>
        </div>

        <div class="card feed-card">
          <div class="feed-title">
            <h2>Лента</h2>
            <button type="button" class="secondary small" id="refreshButton">Обновить</button>
          </div>
          <div id="feed" class="feed"></div>
        </div>
      </section>

      <section class="map-wrap">
        <div id="map"></div>
        <div class="map-note">
          Данные приблизительные. Это не точная траектория и не инструмент наведения.
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/app.js"></script>
  </body>
</html>
